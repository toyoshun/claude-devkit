[project]
name = "claude-devkit"
version = "0.1.0"
description = "Claude Code plugin: pstack routing, usage record, edit checks and principles"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.14.1,<0.15",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S603", "S607", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
mypy_path = "scripts"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["scripts"]
testpaths = ["tests"]
